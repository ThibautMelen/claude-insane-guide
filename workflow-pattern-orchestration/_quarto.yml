format:
  html:
    theme:
      light: cosmo
      dark: darkly
    css: styles.css
    toc: true
    toc-depth: 3
    toc-expand: 2
    number-sections: true
    number-depth: 3
    code-fold: false
    code-tools: true
    code-copy: true
    smooth-scroll: true
    highlight-style: github
    fig-width: 8
    fig-height: 6
    fig-dpi: 300
    link-external-newwindow: true
    link-external-icon: true

execute:
  freeze: auto
  echo: true
  warning: false
  error: false
